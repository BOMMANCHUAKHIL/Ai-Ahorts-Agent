<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'TeluguBold';
    src: url('file:///{{ font_dir }}/NotoSansTelugu-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'TeluguRegular';
    src: url('file:///{{ font_dir }}/NotoSansTelugu-Regular.ttf') format('truetype');
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    font-family: 'TeluguRegular', sans-serif;
    background: #eef5ec;
    overflow: hidden;
  }

  /* Fill the full 1080×1920 canvas.
     Only a modest safe margin at top/bottom so YouTube's
     mini player bar and progress bar don't clip text. */
  .poster {
    width: 1080px;
    height: 1920px;
    padding: 120px 32px 180px 32px;   /* top right bottom left */
    display: flex;
    flex-direction: column;
    gap: 16px;
    background:
      radial-gradient(circle at 10% 5%, #dff0dd 0%, transparent 40%),
      radial-gradient(circle at 90% 95%, #fdf5d8 0%, transparent 40%),
      #eef5ec;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #0f5c1e 0%, #2e7d32 100%);
    border-radius: 30px;
    padding: 30px 40px 26px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(15, 92, 30, 0.30);
    position: relative;
    flex-shrink: 0;
  }
  .header::before,
  .header::after {
    content: "🌿";
    position: absolute;
    top: 16px;
    font-size: 46px;
    opacity: 0.45;
  }
  .header::before { left: 26px; }
  .header::after  { right: 26px; transform: scaleX(-1); }

  .header h1 {
    font-family: 'TeluguBold', sans-serif;
    font-size: 76px;
    color: #ffe27a;
    line-height: 1.18;
    text-shadow: 0 3px 8px rgba(0,0,0,0.35);
    letter-spacing: 0.5px;
  }
  .header h2 {
    font-family: 'TeluguRegular', sans-serif;
    font-size: 34px;
    color: #e9f5e4;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  /* ── Compare headers ── */
  .compare-headers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    flex-shrink: 0;
  }
  .compare-headers .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px;
    border-radius: 22px;
    font-family: 'TeluguBold', sans-serif;
    font-size: 40px;
    color: #fff;
    box-shadow: 0 8px 18px rgba(0,0,0,0.16);
  }
  .badge.good { background: linear-gradient(135deg, #1b5e20, #43a047); }
  .badge.bad  { background: linear-gradient(135deg, #b71c1c, #e53935); }
  .badge .icon {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
  }
  .badge.good .icon { color: #1b5e20; }
  .badge.bad  .icon { color: #b71c1c; }

  /* ── Rows: expand to fill remaining space ── */
  .rows {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .row {
    display: grid;
    grid-template-columns: 190px 1fr 1fr;
    gap: 14px;
    background: #ffffff;
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.07);
    flex: 1 1 0;        /* each row grows equally */
    min-height: 0;
  }

  .time-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(135deg, #fff2c9, #ffd966);
    color: #4e342e;
    font-family: 'TeluguBold', sans-serif;
    font-size: 28px;
    border-radius: 16px;
    padding: 8px;
    line-height: 1.2;
    border: 2px solid #f5c518;
  }

  .food-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px 10px 10px;
    border-radius: 16px;
    overflow: hidden;
    min-width: 0;
  }
  .food-card.good {
    background: #e9f7ea;
    border: 2px solid #a6d8a8;
  }
  .food-card.bad {
    background: #fdeaea;
    border: 2px solid #f2a6a6;
  }

  /* Image auto-sizes with row height */
  .food-card img {
    width: 145px;
    height: 100%;
    max-height: 145px;
    min-height: 100px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 4px 10px rgba(0,0,0,0.14);
    flex-shrink: 0;
    background: #fff;
  }

  .food-card .label {
    font-family: 'TeluguBold', sans-serif;
    font-size: 32px;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .food-card.good .label { color: #14551a; }
  .food-card.bad  .label { color: #9c1f1f; }

  /* ── Tips panel ── */
  .tips {
    background: linear-gradient(135deg, #f3faeb, #fffbdc);
    border: 3px solid #b7df8f;
    border-radius: 24px;
    padding: 20px 28px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.07);
    flex-shrink: 0;
  }
  .tips h3 {
    font-family: 'TeluguBold', sans-serif;
    font-size: 42px;
    color: #295e14;
    text-align: center;
    margin-bottom: 12px;
    letter-spacing: 0.4px;
  }
  .tips-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 28px;
  }
  .tip {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-family: 'TeluguRegular', sans-serif;
    font-size: 27px;
    color: #295e14;
    line-height: 1.3;
  }
  .tip .check {
    color: #1b5e20;
    font-weight: 900;
    font-size: 30px;
    flex-shrink: 0;
    line-height: 1.1;
  }

  /* ── Footer ── */
  .footer {
    background: linear-gradient(135deg, #0f5c1e, #2e7d32);
    color: #ffe27a;
    border-radius: 22px;
    padding: 22px;
    text-align: center;
    font-family: 'TeluguBold', sans-serif;
    font-size: 48px;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 20px rgba(15, 92, 30, 0.30);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="poster">

    <div class="header">
      <h1>{{ telugu_title }}</h1>
      <h2>{{ telugu_subtitle }}</h2>
    </div>

    <div class="compare-headers">
      <div class="badge good">
        <span class="icon">✓</span>
        <span>మంచి ఎంపికలు</span>
      </div>
      <div class="badge bad">
        <span class="icon">✕</span>
        <span>పరిమితం చేయండి</span>
      </div>
    </div>

    <div class="rows">
      {% for row in rows %}
      <div class="row">
        <div class="time-pill">{{ row.time }}</div>

        <div class="food-card good">
          <img src="{{ row.good_image }}" alt="">
          <div class="label">{{ row.good_label }}</div>
        </div>

        <div class="food-card bad">
          <img src="{{ row.bad_image }}" alt="">
          <div class="label">{{ row.bad_label }}</div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="tips">
      <h3>గుర్తుంచుకోండి</h3>
      <div class="tips-grid">
        {% for tip in tips %}
        <div class="tip">
          <span class="check">✓</span>
          <span>{{ tip }}</span>
        </div>
        {% endfor %}
      </div>
    </div>

    <div class="footer">{{ footer }}</div>

  </div>
</body>
</html>
