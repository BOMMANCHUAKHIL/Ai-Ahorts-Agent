<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Telugu';
    src: url('file:///{{ font_dir }}/NotoSansTelugu-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Telugu';
    src: url('file:///{{ font_dir }}/NotoSansTelugu-Regular.ttf') format('truetype');
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    font-family: 'Telugu', sans-serif;
    background: #f4f7f2;
    overflow: hidden;
  }

  .poster {
    width: 1080px;
    height: 1920px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    background:
      radial-gradient(circle at 10% 0%, #e8f5e9 0%, transparent 40%),
      radial-gradient(circle at 90% 100%, #fff8e1 0%, transparent 40%),
      #f4f7f2;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
    border-radius: 28px;
    padding: 30px 36px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(27, 94, 32, 0.25);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: "🌿";
    position: absolute;
    top: 14px;
    right: 26px;
    font-size: 40px;
    opacity: 0.35;
  }
  .header h1 {
    font-size: 62px;
    color: #ffd54f;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.15;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .header h2 {
    font-size: 30px;
    color: #e8f5e9;
    font-weight: 400;
    margin-top: 10px;
  }

  /* ── Comparison headers ── */
  .compare-headers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .compare-headers .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    border-radius: 22px;
    font-size: 34px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .badge.good { background: linear-gradient(135deg, #2e7d32, #43a047); }
  .badge.bad  { background: linear-gradient(135deg, #c62828, #e53935); }
  .badge .icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .badge.good .icon { color: #2e7d32; }
  .badge.bad  .icon { color: #c62828; }

  /* ── Rows ── */
  .rows {
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }
  .row {
    display: grid;
    grid-template-columns: 170px 1fr 1fr;
    gap: 14px;
    align-items: stretch;
    background: #fff;
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }

  .time-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(135deg, #fff3cd, #ffe082);
    color: #5d4037;
    font-size: 24px;
    font-weight: 700;
    border-radius: 16px;
    padding: 12px 8px;
    line-height: 1.2;
    border: 2px solid #ffca28;
  }

  .food-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px 10px 10px;
    border-radius: 16px;
  }
  .food-card.good {
    background: #e8f5e9;
    border: 2px solid #a5d6a7;
  }
  .food-card.bad {
    background: #ffebee;
    border: 2px solid #ef9a9a;
  }

  .food-card img {
    width: 130px;
    height: 130px;
    border-radius: 14px;
    object-fit: cover;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    flex-shrink: 0;
    background: #fff;
  }

  .food-card .label {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.25;
  }
  .food-card.good .label { color: #1b5e20; }
  .food-card.bad  .label { color: #b71c1c; }

  /* ── Tips panel ── */
  .tips {
    background: linear-gradient(135deg, #f1f8e9, #fffde7);
    border: 3px solid #c5e1a5;
    border-radius: 24px;
    padding: 22px 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .tips h3 {
    font-size: 34px;
    color: #33691e;
    text-align: center;
    margin-bottom: 14px;
    font-weight: 700;
  }
  .tips-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 30px;
  }
  .tip {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 24px;
    color: #33691e;
    font-weight: 400;
    line-height: 1.3;
  }
  .tip .check {
    color: #2e7d32;
    font-weight: 700;
    font-size: 26px;
    flex-shrink: 0;
  }

  /* ── Footer ── */
  .footer {
    background: linear-gradient(135deg, #1b5e20, #2e7d32);
    color: #ffd54f;
    border-radius: 22px;
    padding: 20px;
    text-align: center;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 18px rgba(27, 94, 32, 0.28);
  }
</style>
</head>
<body>
  <div class="poster">

    <!-- Header -->
    <div class="header">
      <h1>{{ telugu_title }}</h1>
      <h2>{{ telugu_subtitle }}</h2>
    </div>

    <!-- Good vs Bad headers -->
    <div class="compare-headers">
      <div class="badge good">
        <span class="icon">✓</span>
        <span>మంచి ఎంపికలు</span>
      </div>
      <div class="badge bad">
        <span class="icon">✕</span>
        <span>పరిమితం చేయండి</span>
      </div>
    </div>

    <!-- Rows -->
    <div class="rows">
      {% for row in rows %}
      <div class="row">
        <div class="time-pill">{{ row.time }}</div>

        <div class="food-card good">
          <img src="{{ row.good_image }}" alt="">
          <div class="label">{{ row.good_label }}</div>
        </div>

        <div class="food-card bad">
          <img src="{{ row.bad_image }}" alt="">
          <div class="label">{{ row.bad_label }}</div>
        </div>
      </div>
      {% endfor %}
    </div>

    <!-- Tips -->
    <div class="tips">
      <h3>గుర్తుంచుకోండి</h3>
      <div class="tips-grid">
        {% for tip in tips %}
        <div class="tip">
          <span class="check">✓</span>
          <span>{{ tip }}</span>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">{{ footer }}</div>

  </div>
</body>
</html>
