<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'TeluguBold';
    src: url('file:///{{ font_dir }}/NotoSansTelugu-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'TeluguRegular';
    src: url('file:///{{ font_dir }}/NotoSansTelugu-Regular.ttf') format('truetype');
    font-weight: 400;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    font-family: 'TeluguRegular', sans-serif;
    background: #eef5ec;
    overflow: hidden;
  }

  /* ── Full-canvas poster ── */
  .poster {
    width: 1080px;
    height: 1920px;
    /* Reduced safe margins: header will be visible in Shorts,
       footer won't clash with YouTube's action buttons */
    padding: 70px 28px 110px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background:
      radial-gradient(circle at 10% 5%, #dff0dd 0%, transparent 40%),
      radial-gradient(circle at 90% 95%, #fdf5d8 0%, transparent 40%),
      #eef5ec;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #0f5c1e 0%, #2e7d32 100%);
    border-radius: 28px;
    padding: 26px 40px 22px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(15, 92, 30, 0.30);
    position: relative;
    flex-shrink: 0;
  }
  .header::before,
  .header::after {
    content: "🌿";
    position: absolute;
    top: 14px;
    font-size: 42px;
    opacity: 0.45;
  }
  .header::before { left: 24px; }
  .header::after  { right: 24px; transform: scaleX(-1); }

  .header h1 {
    font-family: 'TeluguBold', sans-serif;
    font-size: 72px;
    color: #ffe27a;
    line-height: 1.15;
    text-shadow: 0 3px 8px rgba(0,0,0,0.35);
    letter-spacing: 0.5px;
  }
  .header h2 {
    font-family: 'TeluguRegular', sans-serif;
    font-size: 30px;
    color: #e9f5e4;
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  /* ── Column headers ── */
  .col-headers {
    display: grid;
    grid-template-columns: 170px 1fr 1fr;
    gap: 14px;
    flex-shrink: 0;
    padding: 0 10px;
  }
  .col-headers > div {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'TeluguBold', sans-serif;
    font-size: 28px;
    letter-spacing: 0.3px;
    padding: 10px 0;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.10);
  }
  .col-headers .ch-time {
    background: linear-gradient(135deg, #ffd966, #f5c518);
    color: #4e342e;
    border: 2px solid #c99400;
  }
  .col-headers .ch-good {
    background: linear-gradient(135deg, #43a047, #2e7d32);
    color: #ffffff;
    border: 2px solid #1b5e20;
  }
  .col-headers .ch-bad {
    background: linear-gradient(135deg, #e53935, #c62828);
    color: #ffffff;
    border: 2px solid #b71c1c;
  }

  /* ── Rows: grow equally to fill remaining space ── */
  .rows {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .row {
    display: grid;
    grid-template-columns: 170px 1fr 1fr;
    gap: 12px;
    background: #ffffff;
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.07);
    flex: 1 1 0;
    min-height: 0;
  }

  .time-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(135deg, #fff2c9, #ffd966);
    color: #4e342e;
    font-family: 'TeluguBold', sans-serif;
    font-size: 27px;
    border-radius: 14px;
    padding: 6px;
    line-height: 1.2;
    border: 2px solid #f5c518;
  }

  .food-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 6px 14px 6px 6px;
    border-radius: 14px;
    overflow: hidden;
    min-width: 0;
  }
  .food-card.good {
    background: #e9f7ea;
    border: 2px solid #a6d8a8;
  }
  .food-card.bad {
    background: #fdeaea;
    border: 2px solid #f2a6a6;
  }

  /* Image grows with the row — no cap */
  .food-card img {
    width: 100%;
    max-width: 210px;
    height: 100%;
    min-height: 120px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 4px 10px rgba(0,0,0,0.14);
    flex-shrink: 0;
    background: #fff;
  }

  .food-card .label {
    font-family: 'TeluguBold', sans-serif;
    font-size: 30px;
    line-height: 1.22;
    overflow-wrap: anywhere;
  }
  .food-card.good .label { color: #14551a; }
  .food-card.bad  .label { color: #9c1f1f; }

  /* ── Tips panel ── */
  .tips {
    background: linear-gradient(135deg, #f3faeb, #fffbdc);
    border: 3px solid #b7df8f;
    border-radius: 22px;
    padding: 14px 22px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.07);
    flex-shrink: 0;
  }
  .tips h3 {
    font-family: 'TeluguBold', sans-serif;
    font-size: 34px;
    color: #295e14;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 0.4px;
  }
  .tips-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 24px;
  }
  .tip {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-family: 'TeluguRegular', sans-serif;
    font-size: 25px;
    color: #295e14;
    line-height: 1.28;
  }
  .tip .check {
    color: #1b5e20;
    font-weight: 900;
    font-size: 28px;
    flex-shrink: 0;
    line-height: 1.1;
  }

  /* ── Footer ── */
  .footer {
    background: linear-gradient(135deg, #0f5c1e, #2e7d32);
    color: #ffe27a;
    border-radius: 20px;
    padding: 18px;
    text-align: center;
    font-family: 'TeluguBold', sans-serif;
    font-size: 44px;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 20px rgba(15, 92, 30, 0.30);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="poster">
      <div class="header">
      <h1>{{ telugu_title }}</h1>
      <h2>{{ telugu_subtitle }}</h2>
    </div>

    <div class="col-headers">
      <div class="ch-time">సమయం</div>
      <div class="ch-good">తినవలసినవి</div>
      <div class="ch-bad">తినకూడనివి</div>
    </div>

    <div class="rows">
      {% for row in rows %}
      <div class="row">
        <div class="time-pill">{{ row.time }}</div>

        <div class="food-card good">
          <img src="{{ row.good_image }}" alt="">
          <div class="label">{{ row.good_label }}</div>
        </div>

        <div class="food-card bad">
          <img src="{{ row.bad_image }}" alt="">
          <div class="label">{{ row.bad_label }}</div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="tips">
      <h3>గుర్తుంచుకోండి</h3>
      <div class="tips-grid">
        {% for tip in tips %}
        <div class="tip">
          <span class="check">✓</span>
          <span>{{ tip }}</span>
        </div>
        {% endfor %}
      </div>
    </div>

    <div class="footer">{{ footer }}</div>

  </div>
</body>
</html>
